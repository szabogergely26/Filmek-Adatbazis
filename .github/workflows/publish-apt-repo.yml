name: Build DEB and publish APT repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Build DEB package
        run: |
          chmod +x packaging/deb/build_deb.sh
          packaging/deb/build_deb.sh

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: filmek-adatbazis-deb
          path: dist/filmek-adatbazis.deb

      - name: Prepare APT repository
        run: |
          mkdir -p apt-repo/pool/main/f/filmek-adatbazis
          mkdir -p apt-repo/dists/stable/main/binary-all

          cp dist/filmek-adatbazis.deb apt-repo/pool/main/f/filmek-adatbazis/

          cd apt-repo

          apt-ftparchive packages pool > dists/stable/main/binary-all/Packages
          gzip -k -f dists/stable/main/binary-all/Packages

           apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Filmek Adatbazis" \
            -o APT::FTPArchive::Release::Label="Filmek Adatbazis" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="all" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Filmek Adatbazis APT Repository" \
            release dists/stable > dists/stable/Release

      - name: Import GPG key
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}

      - name: Sign APT repository
        run: |
          cd apt-repo/dists/stable

          gpg --batch --yes --armor \
            --detach-sign \
            --output Release.gpg \
            Release

          gpg --batch --yes --clearsign \
            --output InRelease \
            Release

      - name: Publish GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./apt-repo
          force_orphan: true



      - name: Publish GitHub Release (rolling)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Filmek-Adatbázis (legfrissebb build)"
          files: dist/filmek-adatbazis.deb
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}